<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoice Calculator</title>
<style>
body{font-family:Arial;background:#f8fafc;padding:25px}
main{max-width:650px;margin:auto;background:white;padding:25px;border-radius:15px}
input{padding:10px;margin:5px;box-sizing:border-box;width:28%}
button{padding:10px 15px;background:#2563eb;color:white;border:0;border-radius:7px;cursor:pointer}
.item{display:flex;gap:5px;align-items:center;margin:8px 0}
.item input{min-width:0;flex:1}
#total{background:#dbeafe;padding:18px;margin-top:18px;border-radius:8px}
</style>
</head>
<body>
<main>
<h1>Invoice Calculator</h1>
<p>Add products, quantities and prices.</p>
<div id="items"></div>
<button onclick="addItem()">Add Item</button>
<div id="total">Invoice total: 0.00</div>
</main>
<script>
function addItem(){
 const row=document.createElement("div");
 row.className="item";
 row.innerHTML=`
 <input class="name" placeholder="Product">
 <input class="qty" type="number" min="1" value="1" placeholder="Quantity">
 <input class="price" type="number" min="0" step="any" placeholder="Price">
 <button type="button">X</button>`;
 row.querySelector("button").onclick=()=>{row.remove();calculate();};
 row.querySelectorAll("input").forEach(x=>x.addEventListener("input",calculate));
 document.getElementById("items").appendChild(row);
 calculate();
}
function calculate(){
 let total=0,valid=true;
 document.querySelectorAll(".item").forEach(row=>{
  const q=Number(row.querySelector(".qty").value);
  const p=Number(row.querySelector(".price").value);
  if(q<=0||p<0||!row.querySelector(".price").value)valid=false;
  else total+=q*p;
 });
 document.getElementById("total").textContent=
 valid?"Invoice total: "+total.toFixed(2):
 "Please enter valid quantities and prices.";
}
addItem();
</script>
</body>
</html>
